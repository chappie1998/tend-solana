name: VSOL Cranker

# Runs the VSOL settlement cranker on a schedule so expired positions get
# settled/refunded and expired markets get cleaned up without a human
# running `npm --prefix vsol run cranker` by hand.
#
# DEVNET ONLY. See docs/OPERATIONS.md for the full runbook, required
# secrets, and the manual local-cron alternative to this workflow.

on:
  schedule:
    # Every 30 minutes, offset off the hour to avoid the top-of-hour crush
    # of scheduled jobs across all of GitHub Actions.
    - cron: "17,47 * * * *"
  workflow_dispatch: {}

concurrency:
  group: vsol-cranker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cranker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: vsol/package-lock.json

      # vsol/ is its own npm package with its own package-lock.json (it is
      # not an npm workspace of the repo root, and the cranker script only
      # ever imports files under vsol/ via relative paths), so only its own
      # dependencies need to be installed here. The repo-root package.json
      # is unrelated to running the cranker and is intentionally not touched.
      - name: Install vsol dependencies
        run: npm --prefix vsol ci

      # Materialize the one signer keypair the cranker needs from a GitHub
      # secret. It holds a JSON array of secret-key bytes and is written to
      # disk only via `env:` -> file redirection, never inlined into a
      # command line and never echoed. vsol/.devnet/ is gitignored, and
      # this job never commits, so nothing here can leak into git.
      - name: Write devnet signer keypair
        working-directory: vsol
        env:
          CREATOR_KEY: ${{ secrets.VSOL_DEVNET_CREATOR_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CREATOR_KEY:-}" ]; then
            echo "Missing required secret: VSOL_DEVNET_CREATOR_KEY." >&2
            echo "Set it in repo Settings -> Secrets and variables -> Actions. See docs/OPERATIONS.md." >&2
            exit 1
          fi
          mkdir -p .devnet
          printf '%s' "$CREATOR_KEY" > .devnet/devnet-creator.json

      # The same creator key is the cranker's fee payer for settle/refund/
      # cleanup transactions, so it drains over time. Warn loudly when low;
      # refuse to run (rather than spam failing transactions) when it's
      # essentially empty. Funding it back up is a manual operator task --
      # see docs/OPERATIONS.md. This never attempts to auto-airdrop.
      - name: Check creator funding
        working-directory: vsol
        env:
          VSOL_RPC_URL: ${{ secrets.VSOL_RPC_URL }}
        run: |
          node <<'JS'
          const fs = require('fs');
          const path = require('path');
          const { Connection, Keypair, LAMPORTS_PER_SOL } = require('@solana/web3.js');

          const WARN_SOL = 0.5;
          const HALT_SOL = 0.01;

          async function main() {
            const rpcUrl = process.env.VSOL_RPC_URL;
            if (!rpcUrl) {
              console.error('VSOL_RPC_URL is not set; cannot check creator funding.');
              process.exit(1);
            }

            const keyPath = path.resolve('.devnet/devnet-creator.json');
            const secret = Uint8Array.from(JSON.parse(fs.readFileSync(keyPath, 'utf8')));
            const creator = Keypair.fromSecretKey(secret);

            const connection = new Connection(rpcUrl, 'confirmed');
            const lamports = await connection.getBalance(creator.publicKey, 'confirmed');
            const sol = lamports / LAMPORTS_PER_SOL;

            console.log(`devnet-creator ${creator.publicKey.toBase58()} balance: ${sol.toFixed(4)} SOL`);

            if (sol < HALT_SOL) {
              console.error(`FATAL: devnet-creator balance (${sol.toFixed(4)} SOL) is essentially zero. Refusing to run the cranker and spam failing transactions -- fund this key before retrying. See docs/OPERATIONS.md.`);
              process.exit(1);
            }

            if (sol < WARN_SOL) {
              console.warn(`WARNING: devnet-creator balance (${sol.toFixed(4)} SOL) is below the ${WARN_SOL} SOL threshold. Top it up soon -- settlement and cleanup fees will keep draining it. See docs/OPERATIONS.md.`);
            }
          }

          main().catch((err) => {
            console.error('Funding check failed: ' + (err && err.stack ? err.stack : String(err)));
            process.exit(1);
          });
          JS

      - name: Run cranker
        run: npm --prefix vsol run cranker
        env:
          VSOL_RPC_URL: ${{ secrets.VSOL_RPC_URL }}
          PYTH_API_KEY: ${{ secrets.PYTH_API_KEY }}
          PYTH_HERMES_URL: ${{ secrets.PYTH_HERMES_URL }}
