[package]
name = "vsol"
version = "0.1.0"
description = "Fully collateralized RFQ options for tokenized assets on Solana"
edition = "2021"
license = "BUSL-1.1"

[lib]
crate-type = ["cdylib", "lib"]
name = "vsol"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { version = "=1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "=1.0.2", features = ["token"] }
solana-ed25519-program = "=3.0.0"
solana-instructions-sysvar = "=3.0.1"
solana-sdk-ids = "=3.1.0"
solana-sha256-hasher = { version = "=3.1.0", features = ["sha2"] }

[dev-dependencies]
proptest = "=1.9.0"
# Self-dependency so integration tests in `tests/` can build instructions with
# the program's own generated `instruction::*` argument types, account
# structs, PDA seed constants, and error enum (Anchor's supported pattern for
# in-process program testing). `no-entrypoint` keeps the BPF entrypoint symbol
# out of this host test binary. Note: the `cpi` feature is intentionally NOT
# used here — with this anchor-lang/anchor-syn version pairing it generates a
# `cpi` module referencing `anchor_lang::__private::CpiReturnData`, a type
# anchor-lang 1.0.2 does not export, which fails to compile. `no-entrypoint`
# alone avoids that codegen path entirely and is all these tests need.
vsol = { path = ".", features = ["no-entrypoint"] }
litesvm = { version = "0.14.0", features = ["precompiles"] }
solana-account = "4.3.1"
solana-clock = "3.1.1"
solana-instruction = "3.4.0"
solana-keypair = "3.1.2"
solana-message = "4.3.0"
solana-signer = "3.0.1"
solana-system-interface = { version = "3.2.0", features = ["bincode"] }
solana-transaction = "4.1.5"
solana-transaction-error = "3.3.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
